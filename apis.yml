name: JustBook
description: 'JustBook was a Berlin, Germany based mobile hotel booking startup that
  offered same-day and last-minute hotel deals at discounted rates, in a model similar
  to HotelTonight. Founded in 2012, it grew to cover last-minute inventory across more
  than 120 cities in Europe and the United States through its iOS, Android, and web
  apps. The company was backed by Creandum, DN Capital, and Earlybird Venture Capital
  (among roughly 21 investors, raising about $3.74M) and was acquired by UK luxury-travel
  company Secret Escapes in January 2014 to strengthen its German-market and mobile
  presence. JustBook no longer operates as an independent brand and publishes no public
  developer program, API, or documentation; this profile is retained as a network
  record of a defunct, acquired Creandum portfolio company. Note: the justbook.de domain
  is now an unrelated book price-comparison site (BookFinder) and is not connected
  to this company.'
